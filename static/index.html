<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Q&A Service</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .question-section {
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        #questionInput {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        #questionInput:focus {
            outline: none;
            border-color: #667eea;
        }

        #askButton {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #askButton:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        #askButton:active {
            transform: translateY(0);
        }

        #askButton:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .example-questions {
            margin-top: 20px;
        }

        .example-questions h3 {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .example-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .example-btn {
            padding: 8px 16px;
            background: #f5f5f5;
            border: 1px solid #e0e0e0;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .example-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .answer-section {
            margin-top: 30px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            display: none;
        }

        .answer-section.show {
            display: block;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .answer-section h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .answer-text {
            color: #555;
            line-height: 1.6;
            font-size: 16px;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #fee;
            border-left-color: #f44;
            color: #c33;
        }

        .footer {
            margin-top: 30px;
            text-align: center;
            color: #999;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💬 Member Q&A Service</h1>
        <p class="subtitle">Ask questions about member data</p>

        <div class="question-section">
            <div class="input-group">
                <input 
                    type="text" 
                    id="questionInput" 
                    placeholder="Ask a question... (e.g., When is Layla planning her trip to London?)"
                    autocomplete="off"
                >
                <button id="askButton" onclick="askQuestion()">Ask</button>
            </div>

            <div class="example-questions">
                <h3>Example Questions</h3>
                <div class="example-buttons">
                    <button class="example-btn" onclick="setQuestion('When is Layla planning her trip to London?')">
                        When is Layla planning her trip to London?
                    </button>
                    <button class="example-btn" onclick="setQuestion('How many cars does Vikram Desai have?')">
                        How many cars does Vikram Desai have?
                    </button>
                    <button class="example-btn" onclick="setQuestion('What are Amira\'s favorite restaurants?')">
                        What are Amira's favorite restaurants?
                    </button>
                </div>
            </div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Finding the answer...</p>
        </div>

        <div class="answer-section" id="answerSection">
            <h3>Answer:</h3>
            <div class="answer-text" id="answerText"></div>
        </div>

        <div class="footer">
            <p>API: <code>/ask</code> endpoint | <a href="/docs" target="_blank">API Docs</a> | <a href="/health" target="_blank">Health</a></p>
        </div>
    </div>

    <script>
        const questionInput = document.getElementById('questionInput');
        const askButton = document.getElementById('askButton');
        const answerSection = document.getElementById('answerSection');
        const answerText = document.getElementById('answerText');
        const loading = document.getElementById('loading');

        questionInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                askQuestion();
            }
        });

        function setQuestion(question) {
            questionInput.value = question;
            questionInput.focus();
        }

        async function askQuestion() {
            const question = questionInput.value.trim();
            
            if (!question) {
                alert('Please enter a question');
                return;
            }

            loading.classList.add('show');
            answerSection.classList.remove('show');
            askButton.disabled = true;

            try {
                const response = await fetch(`/ask?question=${encodeURIComponent(question)}`);
                
                // Check if response is actually JSON
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    const text = await response.text();
                    throw new Error(`Server returned HTML instead of JSON. Status: ${response.status}. Check if the API is running correctly.`);
                }
                
                const data = await response.json();

                if (response.ok) {
                    answerText.textContent = data.answer;
                    answerSection.classList.remove('error');
                    answerSection.classList.add('show');
                } else {
                    throw new Error(data.detail || 'Error processing question');
                }
            } catch (error) {
                answerText.textContent = `Error: ${error.message}`;
                answerSection.classList.add('error');
                answerSection.classList.add('show');
            } finally {
                loading.classList.remove('show');
                askButton.disabled = false;
            }
        }
    </script>
</body>
</html>
